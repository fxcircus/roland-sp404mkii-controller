<script>
'use strict';
(async function(){

/* ---------- load the MIDI map ---------- */
let MAP;
try{
  const r = await fetch('sp404mk2-midi-map.json');
  if(!r.ok) throw new Error('HTTP '+r.status);
  MAP = await r.json();
}catch(e){
  document.getElementById('loadError').textContent =
    'Could not load sp404mk2-midi-map.json ('+e.message+'). Serve this folder with "python3 -m http.server" — file:// blocks fetch.';
  return;
}
/* Suggestions are a nicety, not a dependency — a missing or broken file costs
   the Suggest button and nothing else. */
let MODMAP = null;
try{
  const rm = await fetch('sp404mk2-modulation.json');
  if(rm.ok) MODMAP = await rm.json();
}catch(e){ MODMAP = null; }

document.getElementById('app').hidden = false;

/* ---------- DOM helpers ---------- */
const $ = id => document.getElementById(id);
const el = (t,c,x)=>{ const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; };
const div=(c,x)=>el('div',c,x), span=(c,x)=>el('span',c,x);
const sbtn=(x,c)=>{ const b=el('button','sbtn'+(c?' '+c:''),x); b.type='button'; return b; };

/* ---------- "?" hints ----------
   The explainer text used to sit permanently under every heading. It is
   reference material, not something you need while playing, so it now lives
   behind a "?" in the section title: hover on desktop, tap on touch.       */
const openHints = [];
function hint(sectionId, text){
  if(!text) return null;
  const h2 = document.querySelector('#'+sectionId+' > h2');
  if(!h2) return null;
  let b = h2.querySelector('.hint');
  if(!b){
    b = el('button','hint','?'); b.type='button';
    b.setAttribute('aria-label','What is this section?');
    /* the bubble is a child of the CARD, not the button — anchored to the
       button it would start wherever the title ends and run off a phone. */
    const bub = div('hint__bub'); h2.parentNode.appendChild(bub);
    b._bub = bub;
    b.addEventListener('click', e=>{
      e.stopPropagation();
      const wasOpen = bub.classList.contains('open');
      openHints.forEach(x=>{ x.classList.remove('open'); x._bub.classList.remove('open'); });
      b.classList.toggle('open', !wasOpen);
      bub.classList.toggle('open', !wasOpen);
    });
    h2.appendChild(b); openHints.push(b);
  }
  const bub = b._bub;
  bub.textContent = text;
  b.title = text;
  return b;
}
document.addEventListener('click', ()=> openHints.forEach(x=>{ x.classList.remove('open'); x._bub.classList.remove('open'); }));

/* ---------- constants from the map ---------- */
const FXCC = MAP.effects_control.cc;
let CC_SW = null, CC_SEL = null;
const CTRL_CCS = [];
for(const [num, def] of Object.entries(FXCC)){
  if(/^EFX switch/i.test(def.function)) CC_SW = +num;
  else if(/^EFX select/i.test(def.function)) CC_SEL = +num;
  else{ const m = def.function.match(/^Ctrl (\d)$/i); if(m) CTRL_CCS[+m[1]-1] = +num; }
}
const TABLES = MAP.cc83_effect_tables;
const PARAMS = MAP.effects_parameters;
const BUSES = [
  {label:'BUS 1', ch:1, table:'bus_1_2'}, {label:'BUS 2', ch:2, table:'bus_1_2'},
  {label:'BUS 3', ch:3, table:'bus_3_4'}, {label:'BUS 4', ch:4, table:'bus_3_4'},
  {label:'INPUT', ch:5, table:'input_fx'},
];
const busByCh = {}; BUSES.forEach(b=>busByCh[b.ch]=b);
const busEffect = {};
const LOOP = MAP.looper_mode;
const PADS = MAP.pads_and_patterns;
const PAD_MAP = PADS.midi_mode_A.pad_note_map;
const padNumForNote = {}; PAD_MAP.forEach(p=> padNumForNote[p.note] = p.pad);
const padToNote = {}; PAD_MAP.forEach(p=> padToNote[p.pad] = p.note);
const EXT_NOTE = MAP.ext_source_control.note_mode_A;
const CHROMA_CH = PADS.chromatic.channel;
const chromaR = PADS.chromatic.notes.match(/(\d+)-(\d+)/);
const CHROMA_LO = +chromaR[1], CHROMA_HI = +chromaR[2];
const pcR = PADS.pattern_launch.mapping.match(/PC (\d+)-(\d+)/);
const PC_LO = +pcR[1], PC_HI = +pcR[2];
const VOC_CH = +(Object.keys(MAP.channel_map).find(k=>/vocoder/i.test(MAP.channel_map[k])) || 11);
const BANK_LETTERS = 'ABCDEFGHIJ';
const DJ_REC = MAP.dj_mode.recognized;
const DJ_TX  = MAP.dj_mode.transmit_only;
const DJ_ROWS = [ {cc:7, ch:1}, {cc:7, ch:2}, {cc:7, ch:3}, {cc:8, ch:1} ];

/* ---------- MIDI plumbing ---------- */
let midiAccess = null, midiOut = null, midiIn = null;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function hex(bytes){ return bytes.map(b=>b.toString(16).toUpperCase().padStart(2,'0')).join(' '); }
function noteName(n){ return ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][n%12] + (Math.floor(n/12)-1); }

/* ---------- ORIGAMI DROPDOWN ----------
   The options list is a NESTED strip: each .dd-fold holds its own .dd-leaf plus
   the next fold, so the transforms compound through preserve-3d and it reads as
   one concertina flattening rather than three panels animating separately.
   Hinges alternate and stay under 90deg — past that a leaf turns edge-on to the
   camera and vanishes. The panel is never display:none: a transition cannot
   fire on an element leaving display:none, so it would snap open.          */
const allDropdowns = [];
const CLOSE_MS = 460;
function makeDropdown(opts){
  const wrap = div('dd' + (opts.className ? ' '+opts.className : ''));
  const trigger = el('button','dd-trigger'); trigger.type='button';
  const cur = span('dd-cur'); const caret = span('dd-caret','▼');
  trigger.append(cur, caret);
  const panel = div('dd-panel');
  wrap.append(trigger, panel);
  let options = [], current = null, open = false, closeTimer = null;
  if(opts.width) trigger.style.minWidth = opts.width;
  function label(v){ const o = options.find(x=>x.value===v); return o ? o.label : (opts.placeholder||''); }
  function allOpts(){ return [...panel.querySelectorAll('.dd-opt')]; }
  function paintSel(){ allOpts().forEach((c,i)=> c.classList.toggle('sel', options[i] && options[i].value===current)); cur.textContent = label(current); }
  /* One crease every LEAF_SIZE options. Splitting a long list into a fixed
     three leaves makes each leaf hundreds of px tall, and an 88deg rotation of
     a slab that size projects to thousands of px — it reads as one wall
     swinging at the camera instead of paper folding. Short leaves keep it
     paper no matter how many options there are. */
  const LEAF_SIZE = 3;
  let folds = [];
  function renderPanel(){
    panel.innerHTML=''; folds = [];
    const per = Math.max(1, LEAF_SIZE);
    const groups = [];
    for(let i=0; i<options.length; i+=per) groups.push(options.slice(i, i+per));
    if(!groups.length) groups.push([]);
    const names = ['a','b','c'];
    let node = null;
    for(let i=groups.length-1; i>=0; i--){
      const fold = div('dd-fold dd-fold-'+names[i%3]);
      const leaf = div('dd-leaf'+(i===0?' first':'')+(i===groups.length-1?' last':''));
      groups[i].forEach(o=>{
        const it = el('button','dd-opt', o.label); it.type='button';
        it.addEventListener('click', ()=> choose(o.value, true));
        leaf.appendChild(it);
      });
      fold.appendChild(leaf);
      if(node) fold.appendChild(node);
      node = fold; folds.unshift(fold);
    }
    panel.appendChild(node);
    paintSel();
  }
  /* Stagger has to stay inside the ~440ms close window however many creases
     there are, so the step shrinks as the list grows. */
  function setDelays(reverse){
    const n = folds.length || 1;
    const step = Math.min(65, Math.max(12, Math.round(260 / n)));
    folds.forEach((f, i)=>{
      const d = (reverse ? (n - 1 - i) : i) * step;
      f.style.transitionDelay = d + 'ms';
      const leaf = f.firstElementChild;
      if(leaf) leaf.style.setProperty('--leaf-delay', d + 'ms');
    });
  }
  function setCur(v){ current = v; paintSel(); }
  function choose(v, fire){ setCur(v); closeIt(); if(fire && opts.onChange) opts.onChange(v, options.find(x=>x.value===v)); }
  /* The panel is display:none while closed — a rotateX(88deg) fold under a
     perspective projects a box wider than its layout width, and that counts
     toward page scroll width even when hidden, which drifts the page sideways
     on a phone. Flush layout between showing it and animating, or the folded
     start pose and the flat end pose land in the same recalc and it snaps. */
  function openIt(){
    allDropdowns.forEach(d=> d!==api && d.close());
    clearTimeout(closeTimer); wrap.classList.remove('closing');
    open=true;
    setDelays(false);
    panel.style.display='block';
    void panel.offsetHeight;
    requestAnimationFrame(()=>{ if(open) wrap.classList.add('open'); });
  }
  function closeIt(){
    if(!open) return;
    open=false; setDelays(true); wrap.classList.remove('open'); wrap.classList.add('closing');
    clearTimeout(closeTimer);
    closeTimer = setTimeout(()=>{ wrap.classList.remove('closing'); panel.style.display='none'; }, CLOSE_MS);
  }
  trigger.addEventListener('click', e=>{ e.stopPropagation(); open?closeIt():openIt(); });
  trigger.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ closeIt(); return; }
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      const i = options.findIndex(x=>x.value===current);
      const j = Math.max(0, Math.min(options.length-1, (i<0?0:i) + (e.key==='ArrowDown'?1:-1)));
      if(options[j] && options[j].value !== current) choose(options[j].value, true);
    }
  });
  panel.addEventListener('click', e=> e.stopPropagation());
  document.addEventListener('click', ()=>{ if(open) closeIt(); });
  function setOptions(arr){
    options = arr.map(o => typeof o==='string' ? {value:o, label:o} : o);
    if(!options.find(x=>x.value===current)) current = options.length ? options[0].value : null;
    renderPanel();
  }
  const api = { el:wrap, get:()=>current, set:v=>setCur(v), setOptions,
    selected:()=>options.find(x=>x.value===current), close:closeIt };
  allDropdowns.push(api);
  setOptions(opts.options || []);
  if(opts.value != null) setCur(opts.value);
  return api;
}

/* ---------- hand-ink SVG geometry helpers ----------
   Real wobbly paths instead of an feDisplacementMap: the displacement filter blurred
   every stroke, which is what made the old knobs look mushy. A seeded PRNG keeps each
   knob's wobble stable across repaints while giving every knob its own hand.        */
function rngFrom(seed){
  let s = seed>>>0;
  return function(){
    s = (s + 0x6D2B79F5)|0;
    let t = Math.imul(s ^ (s>>>15), 1|s);
    t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}
/* closed catmull-rom "circle" with per-vertex radius jitter → an inked ring */
function inkBlob(cx, cy, r, seed, amp, n){
  const rnd = rngFrom(seed); n = n || 18; amp = amp==null ? 1.4 : amp;
  const p = [];
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 + (rnd()-.5)*0.06;
    const rr = r + (rnd()-.5)*amp;
    p.push([cx + Math.cos(a)*rr, cy + Math.sin(a)*rr]);
  }
  const f = v => v.toFixed(2);
  let d = 'M'+f(p[0][0])+','+f(p[0][1]);
  for(let i=0;i<n;i++){
    const p0=p[(i-1+n)%n], p1=p[i], p2=p[(i+1)%n], p3=p[(i+2)%n];
    d += 'C'+f(p1[0]+(p2[0]-p0[0])/6)+','+f(p1[1]+(p2[1]-p0[1])/6)
       + ' '+f(p2[0]-(p3[0]-p1[0])/6)+','+f(p2[1]-(p3[1]-p1[1])/6)
       + ' '+f(p2[0])+','+f(p2[1]);
  }
  return d+'Z';
}

/* ---------- KNOB — V2 drawn side profile ----------
   Bottom to top: value arc → cylinder skirt filled with the znSkirtHatch
   pattern → squashed top cap → dashed grip ring → fat pointer. Only the skirt
   height (and the flute group) changes between profiles.                    */
const SKIRT = { cap:6, quarter:15, profile:23 };
const FLUTES = [[31,56,66],[39,60,71],[47,62,73],[57,62,73],[65,60,71],[73,56,66]];
const KCX = 52, KCY = 46, KR = 42;

function knobArc(t){
  const a0 = 135, a1 = 135 + 270*Math.max(t, 0.001);
  const pt = a => { const r = a*Math.PI/180; return [KCX + KR*Math.cos(r), KCY + KR*Math.sin(r)]; };
  const [x0,y0] = pt(a0), [x1,y1] = pt(a1);
  return 'M'+x0.toFixed(1)+','+y0.toFixed(1)+' A'+KR+','+KR+' 0 '+(270*t>180?1:0)+' 1 '+x1.toFixed(1)+','+y1.toFixed(1);
}
function skirtPath(h){
  return 'M25,'+KCY+' L25,'+(KCY+h)+' A27,25 0 0 0 79,'+(KCY+h)+' L79,'+KCY+' A27,25 0 0 1 25,'+KCY+' Z';
}

function makeKnob(opts){
  const min = opts.min!=null?opts.min:0, max = opts.max!=null?opts.max:127;
  let value = opts.value!=null?opts.value:min;
  const def = opts.defaultVal!=null?opts.defaultVal:value;
  const fmt = opts.format || (v=>String(Math.round(v)));
  const step = opts.step || 1;
  const prof = opts.profile || 'quarter';
  const h = SKIRT[prof] != null ? SKIRT[prof] : SKIRT.quarter;
  const skirt = skirtPath(h);

  const root = div('knob'); root.tabIndex = 0;
  root.innerHTML =
    '<svg viewBox="0 0 104 98" width="104" height="98" class="knob-svg">'
    + '<path class="k-track" d="M22.3,75.7 A42,42 0 1 1 81.7,75.7"/>'
    + '<path class="k-fill" d=""/>'
    + '<path class="k-span" d=""/>'
    + '<path class="k-live" d=""/>'
    + '<path class="k-skirt" d="'+skirt+'"/>'
    + '<path class="k-skirt-tex" d="'+skirt+'" fill="url(#znSkirtHatch)" stroke="none"/>'
    + (prof==='profile' ? '<g class="k-flute">'+FLUTES.map(f=>'<line x1="'+f[0]+'" y1="'+f[1]+'" x2="'+f[0]+'" y2="'+f[2]+'"/>').join('')+'</g>' : '')
    + '<ellipse class="k-body" cx="52" cy="46" rx="27" ry="25"/>'
    + '<circle class="k-notch" cx="52" cy="46" r="21" fill="none" stroke-dasharray="2.5 8.5"/>'
    + '<path class="k-ptr" d=""/>'
    + '<path class="k-ptr-side" d=""/>'
    + '</svg>'
    + '<span class="knob-label"><span class="knob-name"></span><span class="knob-val"></span></span>';
  const svg = root.querySelector('.knob-svg');
  const fillEl = root.querySelector('.k-fill');
  const spanEl = root.querySelector('.k-span');
  const liveEl = root.querySelector('.k-live');
  const ptrEl  = root.querySelector('.k-ptr');
  const sideEl = root.querySelector('.k-ptr-side');
  const labEl = root.querySelector('.knob-name');
  const valEl = root.querySelector('.knob-val');
  labEl.textContent = opts.label||'';
  let enabled = true;
  /* When a motion is running the pointer shows where the LFO currently is,
     while `value` stays the centre you dialled. Keeping those separate is what
     lets you drag the knob to move the whole sweep, and lets snapshots store
     the centre rather than whichever instant they were taken at. */
  let modView = null;
  const clamp = v => Math.max(min, Math.min(max, v));
  /* The index line is drawn to the rim EVERY frame rather than being a fixed
     line inside a rotating <g>. Two reasons, and the second is the important
     one:

     1. The cap is an ellipse (rx 27, ry 25), so the rim is a different distance
        out at every angle. A rigid line can only be flush at one of them.
     2. It always terminates ON the rim, so nothing about the line itself
        changes as the wall comes into view — only the overhang below it grows.
        While the line stopped short and then jumped out to the rim to meet the
        overhang, the two appeared together and read as a jolt.

     The overhang is the same line continuing down the moulded side wall, as it
     does on the unit — these are tall cylinders, not discs. The pointer's SVG
     angle is exactly 135 + 270*frac, the same sweep the track uses, so sin() of
     it is how much of that wall faces you: positive across the lower arc,
     peaking at 6 o'clock, zero at 3 and 9 where the wall turns edge-on. Length
     scales by it, so the overhang grows from nothing and needs no threshold.

     Travel runs 7:30 to 4:30, so the pointer never reaches 6 o'clock — the
     overhang is longest at both ends of the sweep and gone by the horizontal. */
  const f1 = n => n.toFixed(1);
  function paintPointer(frac){
    const rad = (135 + 270*frac) * Math.PI/180;
    const sn = Math.sin(rad), cs = Math.cos(rad);
    const inX = 52 + 12*cs, inY = 46 + 12*sn;        // inner end, as before
    const rimX = 52 + 27*cs, rimY = 46 + 25*sn;      // the cap's edge at this angle
    ptrEl.setAttribute('d', 'M'+f1(inX)+','+f1(inY)+' L'+f1(rimX)+','+f1(rimY));
    if(sn <= 0.02){ sideEl.setAttribute('d',''); return; }
    sideEl.setAttribute('d', 'M'+f1(rimX)+','+f1(rimY)+' L'+f1(rimX)+','+f1(rimY + h*sn));
  }
  function paint(){
    const shown = modView != null ? modView : value;
    const frac = (shown-min)/((max-min)||1);
    fillEl.setAttribute('d', knobArc(frac));
    paintPointer(frac);
    valEl.textContent = fmt(shown);
  }
  const MOD_R = 49;
  function modArc(t0, t1){
    t0 = Math.max(0, Math.min(1, t0)); t1 = Math.max(0, Math.min(1, t1));
    if(t1 < t0){ const sw = t0; t0 = t1; t1 = sw; }
    const a0 = 135 + 270*t0, a1 = 135 + 270*t1;
    const pt = a => { const r = a*Math.PI/180; return [52 + MOD_R*Math.cos(r), 46 + MOD_R*Math.sin(r)]; };
    const [x0,y0] = pt(a0), [x1,y1] = pt(a1);
    return 'M'+x0.toFixed(1)+','+y0.toFixed(1)+' A'+MOD_R+','+MOD_R+' 0 '+((a1-a0)>180?1:0)+' 1 '+x1.toFixed(1)+','+y1.toFixed(1);
  }
  function showMod(out, lo, hi){
    if(out == null){ modView = null; root.classList.remove('modulated'); paint(); return; }
    modView = clamp(out); root.classList.add('modulated');
    const f = v => (v-min)/((max-min)||1);
    spanEl.setAttribute('d', modArc(f(lo), f(hi)));
    const c = f(modView);
    liveEl.setAttribute('d', modArc(c-0.013, c+0.013));
    paint();
  }
  function setV(v, silent){
    v = clamp(Math.round(v));
    if(v===value){ paint(); return; }
    value = v; paint();
    if(!silent && opts.onChange) opts.onChange(value);
  }
  paint();
  /* drag accumulates in float space so toggling Shift mid-drag never jumps */
  let dragging=false, lastY=0, acc=0;
  svg.addEventListener('pointerdown', e=>{
    if(!enabled) return; e.preventDefault();
    dragging=true; lastY=e.clientY; acc=value; root.classList.add('drag');
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
  });
  svg.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const sens = (max-min)/(e.shiftKey ? 640 : 160);
    acc = clamp(acc + (lastY - e.clientY)*sens); lastY = e.clientY;
    setV(acc);
  });
  const endDrag = e=>{
    if(!dragging) return;
    dragging=false; root.classList.remove('drag');
    try{svg.releasePointerCapture(e.pointerId);}catch(_){}
    if(opts.springBack) setV(def);
  };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('wheel', e=>{
    if(!enabled) return; e.preventDefault();
    const st = e.shiftKey ? step : step*4;
    setV(value + (e.deltaY<0 ? st : -st));
  }, {passive:false});
  root.addEventListener('dblclick', ()=>{ if(enabled) setV(def); });
  root.addEventListener('keydown', e=>{ if(!enabled) return;
    if(e.key==='ArrowUp'||e.key==='ArrowRight'){ e.preventDefault(); setV(value+step); }
    else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){ e.preventDefault(); setV(value-step); } });
  return { el:root, cc:opts.cc, set:(v,s)=>setV(v,s), get:()=>value,
    min, max, showMod,
    setLabel:t=>{ labEl.textContent=t; }, setTitle:t=>{ root.title=t||''; },
    setEnabled:on=>{ enabled=!!on; root.classList.toggle('disabled', !on); } };
}

/* ---------- MIDI MONITOR ----------
   Off by default, and when it is off logMidi() returns on its first line — so
   the send path costs exactly what it did before. Rows batch through one rAF
   because a busy SP delivers messages faster than the DOM wants to grow.

   Clock (F8) and active sensing (FE) never get a row: at 24ppqn clock alone
   fills the whole buffer in a few seconds and buries everything you opened the
   monitor to see. Clock is still counted, and the counter says so. */
const MON_MAX = 250;
let monOn = false, monSeq = 0, monClockSeen = false, monFlushQueued = false;
let modEmitting = false, monMotionSeen = false;
const monPending = [];
const RT_NAMES = {0xF8:'Clock', 0xFA:'Start', 0xFB:'Continue', 0xFC:'Stop',
                  0xFE:'Active sensing', 0xFF:'System reset', 0xF2:'Song position'};

function ccLabel(ch, cc){
  const bus = busByCh[ch];
  if(bus){
    if(cc === CC_SEL) return 'EFX select · ' + bus.label;
    if(cc === CC_SW)  return 'EFX switch · ' + bus.label;
    const i = CTRL_CCS.indexOf(cc);
    if(i >= 0) return 'CTRL ' + (i+1) + ' · ' + bus.label;
  }
  if(ch === LOOP.channel && LOOP.cc[String(cc)]) return LOOP.cc[String(cc)].function;
  if(DJ_REC && DJ_REC[String(cc)]) return DJ_REC[String(cc)];
  if(DJ_TX  && DJ_TX[String(cc)])  return DJ_TX[String(cc)] + ' (SP→host)';
  if(cc === 120) return 'All Sound Off';
  if(cc === 121) return 'Reset All Controllers';
  if(cc === 123) return 'All Notes Off';
  return '';
}
function noteLabel(ch, note){
  if(note === EXT_NOTE) return 'EXT SOURCE';
  if(ch === CHROMA_CH){ const s = note - CHROMA_ROOT; return 'chromatic ' + (s > 0 ? '+' : '') + s; }
  if(ch === VOC_CH) return 'vocoder';
  if(ch >= 1 && ch <= 10 && padNumForNote[note]) return 'bank ' + BANK_LETTERS[ch-1] + ' pad ' + padNumForNote[note];
  return '';
}
function describeMidi(d){
  const s0 = d[0], st = s0 & 0xF0, ch = (s0 & 0x0F) + 1;
  if(s0 >= 0xF0) return { ch:null, text: RT_NAMES[s0] || ('system ' + s0.toString(16).toUpperCase()) };
  if(st === 0x90 && d[2] > 0){ const x = noteLabel(ch, d[1]); return { ch, text:'Note on  ' + noteName(d[1]) + ' vel ' + d[2] + (x ? ' · ' + x : '') }; }
  if(st === 0x80 || st === 0x90){ const x = noteLabel(ch, d[1]); return { ch, text:'Note off ' + noteName(d[1]) + (x ? ' · ' + x : '') }; }
  if(st === 0xB0){ const x = ccLabel(ch, d[1]); return { ch, text:'CC' + d[1] + ' = ' + d[2] + (x ? ' · ' + x : '') }; }
  if(st === 0xC0) return { ch, text:'Program ' + d[1] + (ch <= 10 ? ' · pattern ' + (d[1]+1) + ' bank ' + BANK_LETTERS[ch-1] : '') };
  if(st === 0xE0){ const v = ((d[2] << 7) | d[1]) - 8192; return { ch, text:'Pitch bend ' + (v > 0 ? '+' : '') + v }; }
  if(st === 0xA0) return { ch, text:'Aftertouch ' + noteName(d[1]) + ' ' + d[2] };
  if(st === 0xD0) return { ch, text:'Channel pressure ' + d[1] };
  return { ch, text:'raw' };
}
function queueMonFlush(){
  if(monFlushQueued) return;
  monFlushQueued = true;
  requestAnimationFrame(flushMonitor);
}
function logMidi(dir, bytes){
  if(!monOn) return;
  const s0 = bytes[0];
  if(s0 === 0xFE) return;
  /* Suppressed traffic still has to reach the counter, or the monitor sits
     blank and silent while the SP is being driven hard. */
  if(s0 === 0xF8){ monClockSeen = true; queueMonFlush(); return; }
  /* an LFO emits continuously; listing it would bury everything else, exactly
     as clock would */
  if(modEmitting){ monMotionSeen = true; queueMonFlush(); return; }
  monPending.push({ dir, bytes: Array.from(bytes) });
  if(monPending.length > MON_MAX) monPending.splice(0, monPending.length - MON_MAX);
  queueMonFlush();
}
function flushMonitor(){
  monFlushQueued = false;
  const log = $('monLog');
  if(!monOn || !log){ monPending.length = 0; return; }
  const empty = log.querySelector('.mempty');
  if(empty && monPending.length) empty.remove();
  /* prepend one at a time: newest first, and a batch inserted as a fragment
     would land oldest-on-top within itself */
  for(const m of monPending){
    const d = describeMidi(m.bytes);
    const row = div('mrow');
    row.append(span('mdir ' + m.dir, m.dir), span('mch', d.ch ? 'ch' + d.ch : '—'),
               span('mtxt', d.text), span('mhex', hex(m.bytes)));
    log.insertBefore(row, log.firstChild);
    monSeq++;
  }
  monPending.length = 0;
  while(log.children.length > MON_MAX) log.removeChild(log.lastChild);
  $('monCount').textContent = (monSeq ? monSeq + ' message' + (monSeq === 1 ? '' : 's') : 'nothing listed yet')
    + (monClockSeen ? ' · clock running (not listed)' : '')
    + (monMotionSeen ? ' · motion running (not listed)' : '');
}
function monitorClear(){
  const log = $('monLog');
  log.innerHTML = ''; monSeq = 0; monClockSeen = false; monMotionSeen = false; monPending.length = 0;
  log.appendChild(div('mempty','Waiting for MIDI — play something here, or on the SP.'));
  $('monCount').textContent = '';
}
function setMonitor(on){
  monOn = !!on;
  const t = $('monToggle');
  t.classList.toggle('on', monOn);
  t.setAttribute('aria-pressed', monOn ? 'true' : 'false');
  $('monLog').hidden = !monOn;
  $('monClear').hidden = !monOn;
  $('monCount').hidden = !monOn;
  if(monOn){ if(!$('monLog').children.length) monitorClear(); }
  else monPending.length = 0;
}
$('monToggle').addEventListener('click', ()=> setMonitor(!monOn));
$('monToggle').title = 'Log every MIDI message in and out. Clock and active sensing are counted but not listed — at 24 ticks a beat they bury everything else.';
$('monClear').addEventListener('click', monitorClear);
setMonitor(false);

/* ---------- MIRROR — follow the SP ----------
   The SP transmits when you operate it (pad notes, effect knob CCs, DJ faders),
   so the UI can follow the hardware. Two rules hold this together:

   1. Every setter here is the SILENT form. A mirror that re-sent what it
      received would loop the message straight back at the unit.
   2. It is PASSIVE and cannot be otherwise. The SP has no SysEx and no state
      readback, so this reflects changes made while it is listening and can
      never pull the current state — before you touch a control, the app is
      guessing. That is the device, not a gap we can engineer away.

   It also does nothing at all without a MIDI input selected, which is what the
   toggle's disabled state says. Needs PAD Note Out / SEQ Note Out enabled in
   the SP's own menu for the note traffic to exist in the first place.       */
let followOn = true;

function mirrorNote(el, on){
  if(!el) return;
  clearTimeout(el._noteT);
  el.classList.toggle('active-key', on);
  /* a dropped note-off would otherwise leave a key lit forever */
  if(on) el._noteT = setTimeout(()=> el.classList.remove('active-key'), 4000);
}
function mirrorIn(d){
  if(!followOn || !midiIn) return;
  const st = d[0] & 0xF0, ch = (d[0] & 0x0F) + 1;

  if(st === 0xB0){
    const cc = d[1], v = d[2];
    const bus = busByCh[ch];
    if(bus){
      if(cc === CC_SEL){
        const code = String(v);
        if(TABLES[bus.table] && TABLES[bus.table][code] != null){ bus.fx.set(code); bus.applyParams(); }
      }else if(cc === CC_SW){
        bus.setEfx(v >= 64);
      }else{
        const i = CTRL_CCS.indexOf(cc);
        if(i >= 0 && bus.knobs[i]) bus.knobs[i].set(v, true);
      }
    }
    if(cc === 7 && djVol[ch]) djVol[ch].set(v, true);
    else if(cc === 8 && ch === 1) djXfade.set(v, true);
    return;
  }

  if(st === 0x90 || st === 0x80){
    const on = st === 0x90 && d[2] > 0, note = d[1];
    if(ch === CHROMA_CH){ mirrorNote(chromaEls[note], on); return; }
    if(ch === VOC_CH){ mirrorNote(vocEls[note], on); return; }
    if(ch >= 1 && ch <= 10 && padNumForNote[note]){
      /* the SP names its bank by the channel it plays on, so following the note
         means following the bank too — otherwise pad 5 of bank C would light up
         pad 5 of whichever bank happens to be showing */
      if(on && ch !== padBank) setPadBank(ch);
      if(ch === padBank) mirrorNote(padEls[padNumForNote[note]], on);
    }
    return;
  }

  if(st === 0xE0 && ch === VOC_CH && vocBendKnob){
    vocBendKnob.set(((d[2] << 7) | d[1]) - 8192, true);
  }
}
function paintFollow(){
  const b = $('followToggle'); if(!b) return;
  const have = !!midiIn, live = followOn && have;
  b.disabled = !have;
  b.classList.toggle('on', live);
  b.setAttribute('aria-pressed', live ? 'true' : 'false');
  b.title = have
    ? 'Follow the SP: turn a knob or change an effect on the unit and the matching control here moves with it. Passive — it never sends anything back, and it can only reflect changes made while it is listening, because the SP cannot be asked its current state.'
    : 'Needs a MIDI input — pick the SP under Input. There is nothing to follow without one.';
}
$('followToggle').addEventListener('click', ()=>{ followOn = !followOn; paintFollow(); });
paintFollow();

/* ---------- sending ---------- */
function sendBytes(bytes, hexEl, timestamp){
  let err = null;
  if(midiOut){ try{ midiOut.send(bytes, timestamp); }catch(ex){ err = ex.message; } }
  logMidi('out', bytes);
  if(hexEl) hexEl.textContent = hex(bytes);
  return !err && !!midiOut;
}
const sendCC   = (ch, cc, val, hexEl) => sendBytes([0xB0|((ch-1)&0x0F), cc&0x7F, val&0x7F], hexEl);
const sendOn   = (ch, note, vel, hexEl) => sendBytes([0x90|((ch-1)&0x0F), note&0x7F, vel&0x7F], hexEl);
const sendOff  = (ch, note, hexEl) => sendBytes([0x80|((ch-1)&0x0F), note&0x7F, 0], hexEl);
const sendPC   = (ch, pgm, hexEl) => sendBytes([0xC0|((ch-1)&0x0F), pgm&0x7F], hexEl);
function sendBend(ch, val, hexEl){ const v = Math.max(0, Math.min(16383, val+8192)); return sendBytes([0xE0|((ch-1)&0x0F), v&0x7F, (v>>7)&0x7F], hexEl); }

/* ---------- panic ---------- */
/* The standard channel-mode sweep does NOT silence the SP: it only honours All
   Sound Off on ch16 and ignores note-off for pads. What actually stops it is
   the looper's [EXIT] stop-all (CC85=127 on ch1, the quad-press equivalent),
   so that leads here and is sent twice in quick succession. */
const STOP_ALL_CC = 85, STOP_ALL_VAL = 127;
function panicAll(){
  const stopCh = (typeof LOOP !== 'undefined' && LOOP.channel) ? LOOP.channel : 1;
  const st0 = (stopCh - 1) & 0x0F;
  const msgs = [[0xB0|st0, STOP_ALL_CC, STOP_ALL_VAL]];
  for(let ch=1; ch<=16; ch++){ const st=(ch-1)&0x0F; msgs.push([0xB0|st,120,0],[0xB0|st,123,0],[0xB0|st,121,0],[0xE0|st,0,64]); }
  let sent = 0, failed = false;
  if(midiOut){
    for(const m of msgs){ try{ midiOut.send(m); sent++; logMidi('out', m); }catch(e){ failed = true; } }
    /* second hit — one press does not always take */
    setTimeout(()=>{ const m = [0xB0|st0, STOP_ALL_CC, STOP_ALL_VAL];
      try{ midiOut.send(m); logMidi('out', m); }catch(e){} }, 60);
  }
  document.querySelectorAll('.active-key').forEach(el=>el.classList.remove('active-key'));
  /* a panic that leaves the LFOs running is worse than no panic at all */
  if(typeof clearAllMotion === 'function') clearAllMotion(true);
}

/* ---------- EFFECTS ---------- */
hint('fx', MAP.effects_control.description+' EFX switch = CC'+CC_SW+', select = CC'+CC_SEL+', Ctrl 1-6 = CC '+CTRL_CCS.join('/')+'. Drag knobs, scroll to step, double-click to reset.');
BUSES.forEach(bus=>{
  const strip = div('bus'); strip.dataset.ch = bus.ch;
  const head = div('bus-head');
  const efx = sbtn('EFX','sm');
  let efxOn = false;
  efx.addEventListener('click', ()=>{ efxOn = !efxOn; efx.classList.toggle('on', efxOn); sendCC(bus.ch, CC_SW, efxOn?127:0, null); });
  /* label is the effect name only; value stays the CC83 code that gets sent */
  const fxOptions = Object.entries(TABLES[bus.table]).sort((a,b)=>+a[0]-+b[0]).map(([code,name])=>({value:code, label:name, name}));
  const fx = makeDropdown({ className:'lcd', options:fxOptions, value:'0', onChange:v=>{ sendCC(bus.ch, CC_SEL, +v, null); applyParams(); } });
  const ann = span('bus-ann','');
  head.append(span('bus-name', bus.label), span('bus-ch','ch'+bus.ch), efx, fx.el, ann);
  const krow = div('knob-row');
  bus.knobs = CTRL_CCS.map((cc,i)=>{
    const k = makeKnob({ label:'CTRL '+(i+1), cc, value:0, onChange:v=>sendCC(bus.ch, cc, v, null) });
    const mb = el('button','modbtn','Mod'); mb.type = 'button';
    mb.title = 'Modulate this parameter — an LFO moves it for you';
    mb.addEventListener('click', ()=> toggleModDrawer(bus, i));
    k.el.appendChild(mb);
    krow.appendChild(k.el); return k;
  });
  const drawer = div('moddrawer'); drawer.appendChild(div('modinner'));
  bus.drawer = drawer;
  strip.append(head, krow, drawer);
  function applyParams(){
    const sel = fx.selected(); const name = sel ? sel.name : null;
    /* CTRL 3 on Slicer and CTRL 3 on Reverb are different parameters, so motion
       assigned to the old effect is meaningless under the new one. Guarded on a
       real change so the first call and a state restore do not wipe anything. */
    if(bus.lastFx !== undefined && bus.lastFx !== name && typeof clearLane === 'function'){
      bus.knobs.forEach((k,i)=> clearLane(bus.ch, i, true));
      if(modEditing && modEditing.ch === bus.ch) closeModDrawer();
    }
    bus.lastFx = name;
    busEffect[bus.ch] = name;
    const ps = name ? PARAMS[name] : null;
    /* effect 0 is OFF — nothing to drive, so the knobs go dead at zero rather
       than sitting live and sending CC that does nothing */
    const isOff = !sel || sel.value === '0' || /^\(?off\)?$/i.test(name || '');
    if(isOff){
      bus.knobs.forEach((k,i)=>{ k.set(0, true); k.setLabel('CTRL '+(i+1));
        k.setTitle('Effect is OFF — pick an effect to enable this control'); k.setEnabled(false); });
      return;
    }
    bus.knobs.forEach((k,i)=>{
      const p = ps ? ps.find(pp=>pp.cc===k.cc) : null;
      if(p){ k.setLabel(p.name); k.setTitle(p.value_range+(p.hint?' — '+p.hint:'')+' (CC'+k.cc+')'); k.setEnabled(true); }
      else if(ps){ k.setLabel('CTRL '+(i+1)); k.setTitle('unused by this effect (CC'+k.cc+')'); k.setEnabled(false); }
      else { k.setLabel('CTRL '+(i+1)); k.setTitle('CC'+k.cc+' — param names unknown for this selection'); k.setEnabled(true); }
    });
  }
  applyParams();
  bus.fx = fx; bus.setEfx = on=>{ efxOn=on; efx.classList.toggle('on',on); }; bus.efxOn = ()=>efxOn;
  bus.applyParams = applyParams; bus.stripEl = strip; bus.annEl = ann;
  $('fxCols').appendChild(strip);
});

/* ---------- CLOCK ----------
   We do not send clock; we FOLLOW it. The SP transmits 0xF8 when MIDI Sync Out
   is ON (implementation chart footnote *3), so with the SP as master the app
   can lock to the unit's own tempo and downbeat — which sidesteps the whole
   two-free-running-oscillators problem, because there is only one oscillator
   and it is the SP's.

   Synced LFOs take their phase from the TICK COUNT, not from elapsed time, so
   they cannot drift: 0xFA resets the count to the downbeat and every cycle is
   measured in ticks from there. Elapsed time is used only to interpolate
   between ticks so slow shapes stay smooth.

   Without clock the same lanes free-run against the typed BPM, which is honest
   — it will not line up with the SP, and the readout says so.              */
const CLK_PPQ = 24;
let clkTicks = 0, clkLastAt = 0, clkInterval = 0, clkSeenAt = 0, clkRunning = false;
let manualBPM = +(lsGet('sp404_bpm') || 120) || 120;

function clockIn(d){
  const s0 = d[0];
  if(s0 === 0xF8){
    const now = performance.now();
    if(clkLastAt){
      const dt = now - clkLastAt;
      /* ignore absurd gaps — a paused sender or a reconnect would otherwise
         drag the average into nonsense */
      if(dt > 2 && dt < 200) clkInterval = clkInterval ? clkInterval*0.85 + dt*0.15 : dt;
    }
    clkLastAt = now; clkSeenAt = now; clkTicks++;
    return;
  }
  if(s0 === 0xFA){ clkTicks = 0; clkRunning = true; clkSeenAt = performance.now(); return; }
  if(s0 === 0xFB){ clkRunning = true; return; }
  if(s0 === 0xFC){ clkRunning = false; return; }
}
const clockLive = ()  => !!clkSeenAt && (performance.now() - clkSeenAt) < 1000;
const clockBPM  = ()  => clkInterval ? 60000 / (clkInterval * CLK_PPQ) : 0;
const tempoBPM  = ()  => (clockLive() && clockBPM()) ? clockBPM() : manualBPM;
function clockTickPos(){
  if(!clockLive() || !clkInterval) return null;
  const frac = Math.min(1, (performance.now() - clkLastAt) / clkInterval);
  return clkTicks + frac;
}
let clkWasLive = null;
function updateClockUI(){
  const live = clockLive(), bpm = clockBPM();
  /* The chips say whether a lane is locked or free-running, so they go stale the
     moment clock appears or drops. The null check is load-bearing: this function
     also runs once at parse time, before the MODULATION block's consts exist,
     and renderMoveBar touches modLanes — calling it then is a TDZ error that
     takes the whole app down before MIDI is even wired up. */
  if(clkWasLive === null) clkWasLive = live;
  else if(clkWasLive !== live){ clkWasLive = live; renderMoveBar(); }
  const inp = $('bpmInput'), st = $('clockState');
  if(live && bpm){
    inp.disabled = true;
    inp.value = bpm.toFixed(1);
    st.textContent = 'following the SP’s clock' + (clkRunning ? '' : ' (stopped)');
    st.classList.add('live');
  }else{
    inp.disabled = false;
    if(document.activeElement !== inp) inp.value = manualBPM.toFixed(1);
    st.textContent = 'no clock on the input — set MIDI Sync Out to ON on the SP to follow it';
    st.classList.remove('live');
  }
}
$('bpmInput').addEventListener('input', ()=>{
  const v = parseFloat($('bpmInput').value);
  if(isFinite(v) && v >= 20 && v <= 300){ manualBPM = v; lsSet('sp404_bpm', String(v)); }
});
setInterval(updateClockUI, 400);
updateClockUI();

/* ---------- MODULATION ----------
   An LFO per CTRL parameter, sending real CC.

   setInterval is the right tool here even though it is the wrong tool for a
   sequencer. A note arriving 30ms late is a flam you hear immediately; a filter
   sweep arriving 30ms late is a filter sweep. Timer jitter simply does not
   matter at these rates, so the lookahead machinery a note scheduler needs
   would be cost without benefit.

   The knob's own value stays the CENTRE you dialled — the LFO rides on top and
   only the pointer moves. That separation is what lets you drag a knob to move
   a whole sweep, and lets snapshots store the centre rather than whatever
   instant they happened to catch.                                            */
const MOD_TICK = 30;
const MOD_SHAPES = [
  { id:'sine', label:'Sine', path:'M1,8 C4,1 7,1 9,8 C11,15 14,15 17,8',
    fn:p=>Math.sin(2*Math.PI*p) },
  { id:'tri',  label:'Tri',  path:'M1,13 L5.5,3 L10,13 L14.5,3 L17,8',
    fn:p=>{ const f=p-Math.floor(p); return f<.5 ? -1+4*f : 3-4*f; } },
  { id:'up',   label:'Ramp', path:'M1,13 L8,3 L8,13 L15,3 L15,13',
    fn:p=>2*(p-Math.floor(p))-1 },
  { id:'down', label:'Fall', path:'M1,3 L8,13 L8,3 L15,13 L15,3',
    fn:p=>1-2*(p-Math.floor(p)) },
  { id:'sq',   label:'Sqr',  path:'M1,13 L1,3 L7,3 L7,13 L13,13 L13,3 L17,3',
    fn:p=>(p-Math.floor(p))<.5 ? 1 : -1 },
  { id:'sh',   label:'S&H',  path:'M1,10 L5,10 L5,4 L9,4 L9,13 L13,13 L13,7 L17,7',
    fn:null },
];
const modShape = id => MOD_SHAPES.find(x=>x.id===id) || MOD_SHAPES[0];
/* Slow to fast, so the rate knob reads left-to-right the way the Hz one does. */
const SYNC_DIVS = [
  { id:'4bar', label:'4 bar', beats:16 },
  { id:'2bar', label:'2 bar', beats:8 },
  { id:'1bar', label:'1 bar', beats:4 },
  { id:'1/2',  label:'1/2',   beats:2 },
  { id:'1/4',  label:'1/4',   beats:1 },
  { id:'1/4T', label:'1/4T',  beats:2/3 },
  { id:'1/8',  label:'1/8',   beats:0.5 },
  { id:'1/8T', label:'1/8T',  beats:1/3 },
  { id:'1/16', label:'1/16',  beats:0.25 },
  { id:'1/32', label:'1/32',  beats:0.125 },
];
const divIndex = id => Math.max(0, SYNC_DIVS.findIndex(d=>d.id===id));
const MOD_DEFAULT = { shape:'sine', mode:'hz', rate:0.25, div:'1bar', depth:50, phase:0, bipolar:true, running:true };
const RATE_LO = Math.log(0.02), RATE_HI = Math.log(20);
const posToRate = p => Math.exp(RATE_LO + (p/100)*(RATE_HI-RATE_LO));
const rateToPos = r => Math.round(((Math.log(Math.max(0.02, Math.min(20, r))) - RATE_LO)/(RATE_HI-RATE_LO))*100);
const rateText  = r => (r < 1 ? r.toFixed(2) : r.toFixed(1)) + 'Hz';
function laneRateText(L){
  if(L.mode !== 'sync') return rateText(L.rate);
  const d = SYNC_DIVS[divIndex(L.div)] || SYNC_DIVS[2];
  return d.label + (clockLive() ? ' ⟲' : ' @' + Math.round(tempoBPM()));
}

const modLanes = {};
const modKey = (ch, cc) => ch + ':' + cc;
let modTimer = null, modT0 = 0, modEditing = null;

function modTick(){
  const t = (performance.now() - modT0) / 1000;
  for(const key in modLanes){
    const L = modLanes[key];
    const bus = busByCh[L.ch]; if(!bus || !bus.knobs) continue;
    const k = bus.knobs[L.i]; if(!k) continue;
    if(!L.running){ k.showMod(null); continue; }
    const centre = k.get();
    const span = (L.depth/100) * 63.5;
    let p;
    if(L.mode === 'sync'){
      const beats = (SYNC_DIVS[divIndex(L.div)] || SYNC_DIVS[2]).beats;
      const tp = clockTickPos();
      /* phase from the tick COUNT when clock is present, so it cannot drift and
         0xFA puts every lane back on the downbeat together */
      p = (tp != null ? tp/(CLK_PPQ*beats) : t*(tempoBPM()/60)/beats) + (L.phase||0);
    }else{
      p = t*L.rate + (L.phase||0);
    }
    let u;
    if(L.shape === 'sh'){
      /* hash the step, don't re-roll: sampling Math.random every frame would be
         noise, not sample-and-hold */
      const x = Math.sin(Math.floor(p)*12.9898 + 78.233 + L.cc)*43758.5453;
      u = (x - Math.floor(x))*2 - 1;
    }else{
      u = modShape(L.shape).fn(p);
    }
    if(!L.bipolar) u = (u + 1)/2;
    const out = Math.max(0, Math.min(127, Math.round(centre + u*span)));
    k.showMod(out, Math.max(0, centre - (L.bipolar ? span : 0)), Math.min(127, centre + span));
    /* only on change: a slow sine spends most of its life on a value the SP
       already holds, and dropping the repeats roughly halves the traffic */
    if(out !== L.last){
      L.last = out;
      modEmitting = true;
      try{ sendCC(L.ch, L.cc, out, null); }finally{ modEmitting = false; }
    }
  }
}
function ensureModTimer(){
  if(modTimer) return;
  modT0 = performance.now();
  modTimer = setInterval(modTick, MOD_TICK);
}
function stopModTimer(){ if(modTimer){ clearInterval(modTimer); modTimer = null; } }

function setLane(ch, i, patch){
  const cc = CTRL_CCS[i]; if(cc == null) return null;
  const key = modKey(ch, cc);
  const isNew = !modLanes[key];
  const lane = modLanes[key] || Object.assign({ ch, i, cc, last:null }, MOD_DEFAULT);
  modLanes[key] = Object.assign(lane, patch || {});
  lane.last = null;                 // force the next tick to emit
  if(isNew || (patch && patch.recentre)) fitCentre(ch, i, lane);
  ensureModTimer(); renderMoveBar(); paintModButtons();
  return lane;
}
/* A CTRL knob sits at 0 until you move it, and a bipolar LFO centred on 0
   spends half its cycle clamped against the floor — you assign modulation and
   nothing appears to happen. So when a lane is first created, slide the centre
   just far enough that the whole swing fits. Only on creation: doing it on
   every depth tweak would fight you while you dial. */
function fitCentre(ch, i, lane){
  const bus = busByCh[ch], k = bus && bus.knobs ? bus.knobs[i] : null;
  if(!k) return;
  const span = (lane.depth/100) * 63.5;
  let lo = lane.bipolar ? span : 0, hi = 127 - span;
  if(lo > hi) lo = hi = 63;
  const want = Math.round(Math.max(lo, Math.min(hi, k.get())));
  if(want !== k.get()) k.set(want);      // not silent: the centre really moved
}
function clearLane(ch, i, silent){
  const cc = CTRL_CCS[i]; if(cc == null) return;
  const key = modKey(ch, cc);
  if(!modLanes[key]) return;
  delete modLanes[key];
  const bus = busByCh[ch], k = bus && bus.knobs ? bus.knobs[i] : null;
  if(k){
    k.showMod(null);
    /* put the parameter back where you set it — otherwise it stays frozen
       wherever the LFO happened to stop */
    if(!silent) sendCC(ch, cc, k.get(), null);
  }
  if(!Object.keys(modLanes).length) stopModTimer();
  renderMoveBar(); paintModButtons();
}
function clearAllMotion(silent){
  Object.keys(modLanes).forEach(key=>{
    const L = modLanes[key];
    delete modLanes[key];
    const bus = busByCh[L.ch], k = bus && bus.knobs ? bus.knobs[L.i] : null;
    if(k){ k.showMod(null); if(!silent) sendCC(L.ch, L.cc, k.get(), null); }
  });
  stopModTimer(); closeModDrawer(); renderMoveBar(); paintModButtons();
}

function paramNameFor(bus, i){
  const fxName = busEffect[bus.ch];
  const ps = fxName ? PARAMS[fxName] : null;
  const p = ps ? ps.find(x=>x.cc === CTRL_CCS[i]) : null;
  return p ? p.name : 'CTRL ' + (i+1);
}
function paramRangeFor(bus, i){
  const fxName = busEffect[bus.ch];
  const ps = fxName ? PARAMS[fxName] : null;
  const p = ps ? ps.find(x=>x.cc === CTRL_CCS[i]) : null;
  return (p ? p.value_range + ' · ' : '') + 'CC' + CTRL_CCS[i];
}
function suggestionsFor(bus){
  if(!MODMAP || !MODMAP.by_effect) return null;
  const fxName = busEffect[bus.ch];
  return (fxName && MODMAP.by_effect[fxName]) ? MODMAP.by_effect[fxName] : null;
}

function paintModButtons(){
  BUSES.forEach(bus=>{
    if(!bus.knobs) return;
    bus.knobs.forEach((k,i)=>{
      const live = !!modLanes[modKey(bus.ch, CTRL_CCS[i])];
      k.el.classList.toggle('modulated', live);
      k.el.classList.toggle('mod-editing', !!(modEditing && modEditing.ch === bus.ch && modEditing.i === i));
      if(!live) k.showMod(null);
    });
  });
}
function renderMoveBar(){
  const bar = $('moveBar'), wrap = $('moveChips');
  const keys = Object.keys(modLanes);
  bar.hidden = !keys.length;
  wrap.innerHTML = '';
  keys.forEach(key=>{
    const L = modLanes[key];
    const bus = busByCh[L.ch]; if(!bus) return;
    const sh = modShape(L.shape);
    const chip = span('mvchip');
    chip.innerHTML = '<svg viewBox="0 0 18 16" width="18" height="14" aria-hidden="true"><path d="'+sh.path
      + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    chip.append(el('b',null, bus.label + ' ' + paramNameFor(bus, L.i)),
                document.createTextNode(' ' + laneRateText(L) + ' · ' + L.depth + '%'));
    const x = el('button','x','×'); x.type='button';
    x.setAttribute('aria-label','Stop ' + paramNameFor(bus, L.i));
    x.addEventListener('click', e=>{ e.stopPropagation(); clearLane(L.ch, L.i); });
    chip.appendChild(x);
    chip.addEventListener('click', ()=> openModDrawer(bus, L.i));
    wrap.appendChild(chip);
  });
}
$('stopMotion').addEventListener('click', ()=> clearAllMotion());
$('stopMotion').title = 'Return every modulated parameter to the value you set and stop the LFOs.';

/* ---------- the drawer ---------- */
function closeModDrawer(){
  if(!modEditing) return;
  const bus = busByCh[modEditing.ch];
  if(bus && bus.drawer) bus.drawer.classList.remove('open');
  modEditing = null;
  paintModButtons();
}
function toggleModDrawer(bus, i){
  if(modEditing && modEditing.ch === bus.ch && modEditing.i === i) closeModDrawer();
  else openModDrawer(bus, i);
}
function openModDrawer(bus, i){
  if(modEditing && modEditing.ch !== bus.ch){
    const other = busByCh[modEditing.ch];
    if(other && other.drawer) other.drawer.classList.remove('open');
  }
  modEditing = { ch:bus.ch, i };
  const lane = modLanes[modKey(bus.ch, CTRL_CCS[i])] || setLane(bus.ch, i, {});
  const inner = bus.drawer.firstElementChild;
  inner.innerHTML = '';

  const body = div('modbody');
  const head = div('modhead');
  head.append(span('t', bus.label + ' · ' + paramNameFor(bus, i)), span('r', paramRangeFor(bus, i)));
  const done = sbtn('Done','sm'); done.classList.add('close');
  done.addEventListener('click', closeModDrawer);
  head.appendChild(done);

  const grid = div('modgrid');
  const fShape = div('modfield');
  fShape.appendChild(span('modlab','Shape'));
  const shapes = div('shapes');
  MOD_SHAPES.forEach(sh=>{
    const b = el('button','shape'); b.type='button';
    b.setAttribute('aria-pressed', String(sh.id === lane.shape));
    b.innerHTML = '<svg viewBox="0 0 18 16" aria-hidden="true"><path d="'+sh.path+'"/></svg>';
    b.appendChild(el('span',null,sh.label));
    b.addEventListener('click', ()=>{
      setLane(bus.ch, i, { shape:sh.id });
      [...shapes.children].forEach((c,j)=> c.setAttribute('aria-pressed', String(MOD_SHAPES[j].id === sh.id)));
    });
    shapes.appendChild(b);
  });
  fShape.appendChild(shapes);

  const fKnobs = div('modfield');
  const rlab = div('modfield');
  const modeWrap = div('modmode');
  [['hz','Hz'],['sync','Sync']].forEach(([id,txt])=>{
    const b = el('button',null,txt); b.type='button';
    b.setAttribute('aria-pressed', String((lane.mode||'hz') === id));
    b.addEventListener('click', ()=>{ setLane(bus.ch, i, { mode:id }); openModDrawer(bus, i); });
    modeWrap.appendChild(b);
  });
  const rateHead = div('modlab-row');
  rateHead.append(span('modlab','Rate & depth'), modeWrap);
  fKnobs.appendChild(rateHead);
  const kwrap = div('modknobs');
  const synced = (lane.mode === 'sync');
  const rk = synced
    ? makeKnob({ label:'RATE', min:0, max:SYNC_DIVS.length-1, value:divIndex(lane.div),
        format:v=>SYNC_DIVS[Math.round(v)].label,
        onChange:v=> setLane(bus.ch, i, { div:SYNC_DIVS[Math.round(v)].id }) })
    : makeKnob({ label:'RATE', min:0, max:100, value:rateToPos(lane.rate),
        format:v=>rateText(posToRate(v)), onChange:v=> setLane(bus.ch, i, { rate:posToRate(v) }) });
  rk.setTitle(synced
    ? 'One cycle per this many beats, locked to the SP’s clock when it is sending one. Otherwise it runs against the tempo set in the MIDI card.'
    : 'How fast the parameter moves, independent of any tempo. 0.02Hz is a 50-second sweep; 20Hz is a wobble.');
  const dk = makeKnob({ label:'DEPTH', min:0, max:100, value:lane.depth,
    format:v=>v+'%', onChange:v=> setLane(bus.ch, i, { depth:v }) });
  dk.setTitle('How far it swings either side of the value you set.');
  kwrap.append(rk.el, dk.el);
  fKnobs.appendChild(kwrap);
  grid.append(fShape, fKnobs);

  const foot = div('modfoot');
  const bip = sbtn(lane.bipolar ? 'Bipolar' : 'Unipolar','sm');
  bip.classList.toggle('on', lane.bipolar);
  bip.addEventListener('click', ()=>{
    const L = setLane(bus.ch, i, { bipolar: !modLanes[modKey(bus.ch, CTRL_CCS[i])].bipolar });
    bip.textContent = L.bipolar ? 'Bipolar' : 'Unipolar'; bip.classList.toggle('on', L.bipolar);
  });
  const run = sbtn(lane.running ? 'Running' : 'Paused','sm');
  run.classList.toggle('on', lane.running);
  run.addEventListener('click', ()=>{
    const L = setLane(bus.ch, i, { running: !modLanes[modKey(bus.ch, CTRL_CCS[i])].running });
    run.textContent = L.running ? 'Running' : 'Paused'; run.classList.toggle('on', L.running);
    if(!L.running){ const k = bus.knobs[i]; k.showMod(null); sendCC(bus.ch, CTRL_CCS[i], k.get(), null); }
  });
  const rm = sbtn('Remove','sm'); rm.classList.add('rm');
  rm.addEventListener('click', ()=>{ clearLane(bus.ch, i); closeModDrawer(); });
  foot.append(bip, run, rm);

  body.append(head, grid, foot);

  const blk = suggestionsFor(bus);
  const sg = blk ? blk.suggest.find(x=> x.param === paramNameFor(bus, i)) : null;
  if(sg){
    const row = div('modsug');
    const apply = sbtn('Use suggested','sm');
    apply.addEventListener('click', ()=>{
      setLane(bus.ch, i, { shape:sg.shape, rate:sg.rate, depth:sg.depth,
        mode: sg.sync ? 'sync' : 'hz', div: sg.sync || '1bar',
        phase:sg.phase || 0, bipolar:sg.bipolar !== false, running:true });
      openModDrawer(bus, i);
    });
    row.append(apply, span('modwhy', sg.why));
    body.appendChild(row);
  }
  inner.appendChild(body);
  bus.drawer.classList.add('open');
  paintModButtons(); renderMoveBar();
}

/* ---------- declared audio routing ---------- */
const ROUTING = MAP.audio_routing;
let routeApi = null;
if(ROUTING && Array.isArray(ROUTING.params)){
  const routeState = (function(){
    let saved = {}; try{ saved = JSON.parse(lsGet('sp404_routing')) || {}; }catch(e){}
    const st = {}; ROUTING.params.forEach(p=>{ st[p.key] = (p.options.includes(saved[p.key]) ? saved[p.key] : p.ui_default); });
    return st;
  })();
  const routeDDs = {};
  const wrap = $('fxRouting');
  wrap.appendChild(div('title','Your SP audio routing — declare it (the app can’t read it; it always sends on ch1-5)'));
  const grid = div('rgrid');
  ROUTING.params.forEach(p=>{
    const lab = el('label','rlab'); lab.appendChild(document.createTextNode(p.label));
    const dd = makeDropdown({ options:p.options, value:routeState[p.key], onChange:v=>{ routeState[p.key]=v; lsSet('sp404_routing', JSON.stringify(routeState)); applyRouting(); } });
    if(p.note) dd.el.title = p.note;
    routeDDs[p.key] = dd;
    lab.appendChild(dd.el); grid.appendChild(lab);
  });
  wrap.appendChild(grid);
  const rnote = div('rn'); wrap.appendChild(rnote);
  function applyRouting(){
    const serial = /TYPE A/i.test(routeState.bus12);
    const favOff = /bypass/i.test(routeState.favorite);
    const inputBus = routeState.inputBus;
    const dryThroughMaster = /before BUS 3/i.test(routeState.dryRouting);
    BUSES.forEach(bus=>{
      if(!bus.annEl) return;
      bus.stripEl.classList.remove('inactive');
      bus.stripEl.hidden = false;
      if(bus.ch === 1) bus.annEl.textContent = serial ? 'Insert FX · serial → feeds BUS 2' : 'Insert FX · parallel (independent)';
      else if(bus.ch === 2) bus.annEl.textContent = serial ? 'Insert FX · serial ← receives BUS 1' : 'Insert FX · parallel (independent)';
      else if(bus.ch === 3 || bus.ch === 4){
        if(favOff){ bus.stripEl.hidden = true; bus.annEl.textContent = ''; }
        else bus.annEl.textContent = 'Master FX · FAVORITE ' + routeState.favorite + (bus.ch===3 && dryThroughMaster ? ' · DRY runs through here' : '');
      }else if(bus.ch === 5) bus.annEl.textContent = 'External input → feeds ' + inputBus + (inputBus === 'DRY' ? ' (skips BUS 1/2 insert FX)' : '');
    });
    rnote.textContent = 'Signal: ' + (serial ? 'BUS1→BUS2' : 'BUS1 ∥ BUS2') + ' → '
      + (favOff ? '(BUS3/4 bypassed)' : 'BUS3→BUS4') + ' → OUT · DRY ' + routeState.dryRouting + ' · INPUT→' + inputBus
      + '.  Hardware-only settings; nothing here is sent over MIDI.';
  }
  applyRouting();
  routeApi = {
    get: ()=> Object.assign({}, routeState),
    set: obj=>{
      if(!obj) return;
      ROUTING.params.forEach(p=>{
        if(!p.options.includes(obj[p.key])) return;
        routeState[p.key] = obj[p.key];
        if(routeDDs[p.key]) routeDDs[p.key].set(obj[p.key]);
      });
      lsSet('sp404_routing', JSON.stringify(routeState));
      applyRouting();
    },
  };
}

/* ---------- pressable key helper ---------- */
function pressable(node, getCh, note, getVel, beforeNote){
  let downCh = null;
  node.addEventListener('pointerdown', e=>{ e.preventDefault(); if(beforeNote) beforeNote(); downCh = getCh(); node.classList.add('active-key'); sendOn(downCh, note, getVel()); });
  const up = ()=>{ if(downCh === null) return; sendOff(downCh, note); downCh = null; node.classList.remove('active-key'); };
  node.addEventListener('pointerup', up);
  node.addEventListener('pointerleave', up);
  node.addEventListener('pointercancel', up);
  node.addEventListener('contextmenu', e=>e.preventDefault());
}

function editPadName(pad, lab){
  if(lab._editing) return;
  lab._editing = true;
  const bank = padBank;                       // the bank as it was when editing began
  const input = el('input','pad-name-input');
  input.type = 'text'; input.maxLength = 24; input.value = padNameOf(bank, pad);
  input.placeholder = 'name';
  lab.hidden = true;
  padEls[pad].appendChild(input);
  input.focus(); input.select();
  const done = commit=>{
    if(!lab._editing) return;
    lab._editing = false;
    if(commit) setPadName(bank, pad, input.value);
    input.remove(); lab.hidden = false; renderPadNames();
  };
  input.addEventListener('keydown', e=>{

    if(e.key === 'Enter'){ e.preventDefault(); done(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); done(false); }
  });
  input.addEventListener('blur', ()=> done(true));
  ['pointerdown','pointerup','pointerleave','click'].forEach(t=>
    input.addEventListener(t, e=> e.stopPropagation()));
}

let extApi = null;
{
  const extBtn = sbtn('EXT SOURCE','accent2'); $('extMount').appendChild(extBtn);
  const modeBtn = $('extModeToggle');
  let gateMode = false;
  /* toggle (default): press latches on and stays lit until pressed again.
     gate: sounds only while held. */
  let onCh = null;              // channel the latched/held note went out on
  function extOff(){ if(onCh === null) return; sendOff(onCh, EXT_NOTE); onCh = null;
    extBtn.classList.remove('on','held'); extBtn.setAttribute('aria-pressed','false'); }
  function extOn(){ onCh = padCh(); sendOn(onCh, EXT_NOTE, padVel());
    extBtn.classList.add(gateMode ? 'held' : 'on'); extBtn.setAttribute('aria-pressed','true'); }
  extBtn.setAttribute('aria-pressed','false');
  modeBtn.addEventListener('click', ()=>{
    extOff();                   // never leave a latched note behind on a mode change
    gateMode = !gateMode; modeBtn.textContent = 'mode: '+(gateMode?'gate (hold)':'toggle');
  });
  extBtn.addEventListener('pointerdown', e=>{ e.preventDefault();
    if(gateMode){ extOn(); } else { onCh === null ? extOn() : extOff(); } });
  const up = ()=>{ if(gateMode) extOff(); };
  extBtn.addEventListener('pointerup', up);
  extBtn.addEventListener('pointerleave', up);
  extBtn.addEventListener('pointercancel', up);
  function setGate(g){
    if(!!g === gateMode) return;
    extOff();
    gateMode = !!g; modeBtn.textContent = 'mode: '+(gateMode?'gate (hold)':'toggle');
  }
  /* Restoring "on" silently is the CORRECT reading, not a fudge: a latched note
     was already sent and nothing sent note-off, so the SP is still holding it
     across the refresh. Keeping the channel matters — a later toggle has to
     send note-off on the channel the note actually went out on. */
  extApi = {
    get: ()=> ({ on: onCh !== null, ch: onCh, gate: gateMode }),
    set: (st, send)=>{
      if(!st) return;
      setGate(st.gate);
      if(st.on){
        if(send){ extOff(); extOn(); }
        else{ onCh = st.ch || padCh();
          extBtn.classList.add(gateMode ? 'held' : 'on'); extBtn.setAttribute('aria-pressed','true'); }
      }else{
        if(send) extOff();
        else{ onCh = null; extBtn.classList.remove('on','held'); extBtn.setAttribute('aria-pressed','false'); }
      }
    },
  };
}

/* ---------- CHROMATIC ----------
   The hardware plays chromatic mode from its PADS, not a keyboard, so this is a
   pad bank. CH16 accepts notes 36-60 and that range is centred on note 48, so
   it is exactly -12..+12 semitones from the root — 25 pads, root dead centre of
   a 5x5.

   These pads are ignored unless the UNIT is already in chromatic mode: the
   implementation chart lists Recognized "36-60 (C2-C4, CH 16)" under footnote
   *6, "Enabled when playing samples in chromatic mode". The sample is whichever
   pad was selected BEFORE entering that mode (manual p.25 step 1), and both the
   pad press and SHIFT+[PAD 4] are front-panel only — no MIDI, no SysEx. So the
   honest thing the app can do is print the three steps.                      */
const CHROMA_ROOT = 48;
const BLACK_PC = [1,3,6,8,10];
const isAccidental = n => BLACK_PC.includes(((n%12)+12)%12);

  for(let semi = CHROMA_LO - CHROMA_ROOT; semi <= CHROMA_HI - CHROMA_ROOT; semi++){
    const note = CHROMA_ROOT + semi;
    const b = sbtn((semi > 0 ? '+' : '') + semi);

      + ' · ' + noteName(note) + ' · note ' + note + ' · ch' + CHROMA_CH;

function buildVocKeyboard(){
  const container = $('vocKbd');

  const W_ADV = 45, W_WIDTH = 42, B_WIDTH = 28, SEAM = -1.5;
  container.innerHTML = '';
  for(const k in vocEls) delete vocEls[k];
  const whites = div('piano-whites');
  container.appendChild(whites);
  let wIdx = 0;
  for(let n = 36; n <= 72; n++){
    const black = isAccidental(n);

    else{ if(n%12===0) k.classList.add('c-key'); whites.appendChild(k); wIdx++; }

}
{ /* The wire value is the raw 14-bit MIDI number (-8192..+8191), which means

/* There is NO MIDI control for the unit's output volume. The implementation
   chart (p.168) lists CC#07 as "o *8 / o *8", and *8 is "control change message
   numbers and corresponding controllers in DJ mode" — so CC7 is answered only
   in DJ mode, and only as the CH1 / CH2 / pattern-sequencer channel faders. The
   front-panel [VOLUME] knob that sets overall output level (p.19) appears
   nowhere in the chart. These therefore live in DJ mode, where they work. */
const VOL_LABELS = { 1:'VOL CH1', 2:'VOL CH2', 3:'VOL SEQ' };
function volKnob(ch){
  const k = makeKnob({ label:VOL_LABELS[ch], min:0, max:127, value:100, defaultVal:100,
    onChange:v=>sendCC(ch, 7, v, null) });
  k.setTitle(DJ_REC['7'] + ' (CC7 ch'+ch+') — DJ mode only');
  return k;
}
/* A crossfader is a horizontal throw, not a rotation — a knob for it reads
   wrong and loses the centre detent that matters most. */
function makeXFade({ cc, ch, min=0, max=127, value=64 }){
  const root = div('xfade'); root.tabIndex = 0;
  root.innerHTML = '<div class="xfade__track">'
    + '<span class="xfade__slot"></span>'
    + '<span class="xfade__post xfade__post--l"></span>'
    + '<span class="xfade__post xfade__post--r"></span>'
    + '<span class="xfade__rail"><span class="xfade__cap"></span></span>'
    + '</div>'
    + '<div class="xfade__ends"><span>CH1</span><span>X-FADE</span><span>CH2</span></div>';
  const track = root.querySelector('.xfade__track');
  const rail  = root.querySelector('.xfade__rail');
  const cap   = root.querySelector('.xfade__cap');
  let v = value;
  root.setAttribute('role','slider');
  root.setAttribute('aria-valuemin', min); root.setAttribute('aria-valuemax', max);
  root.title = DJ_REC[String(cc)] + ' (CC'+cc+' ch'+ch+') — DJ mode only';
  function paint(){
    cap.style.left = (((v - min) / (max - min)) * 100) + '%';
    root.setAttribute('aria-valuenow', v);
  }
  function setV(n, silent){
    n = Math.max(min, Math.min(max, Math.round(n)));
    if(n === v){ paint(); return; }
    v = n; paint(); if(!silent) sendCC(ch, cc, v, null);
  }
  function fromEvent(e){
    /* measure the rail, not the track — the cap's travel is inset by the posts */
    const r = rail.getBoundingClientRect();
    setV(min + ((e.clientX - r.left) / r.width) * (max - min));
  }
  let dragging = false;
  track.addEventListener('pointerdown', e=>{ e.preventDefault(); dragging = true;
    try{ track.setPointerCapture(e.pointerId); }catch(_){}
    fromEvent(e); });
  track.addEventListener('pointermove', e=>{ if(dragging) fromEvent(e); });
  const end = e=>{ if(!dragging) return; dragging = false;
    try{ track.releasePointerCapture(e.pointerId); }catch(_){} };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);
  root.addEventListener('dblclick', ()=> setV((min + max) / 2));
  root.addEventListener('keydown', e=>{
    if(e.key === 'ArrowLeft'){ e.preventDefault(); setV(v - (e.shiftKey ? 1 : 4)); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); setV(v + (e.shiftKey ? 1 : 4)); }
  });
  paint();
  return { el:root, set:(n,silent)=>setV(n,silent), get:()=>v };
}

(async function shortcutFinder(){

      if((capF === 'full' || capF === 'partial' || capF === 'hw') && cap !== capF) return false;
      if(q){ const hay=[it.name,it.desc,it.mode,it.category,(it.combo||[]).join(' '),it.app_midi&&it.app_midi.how].filter(Boolean).join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
      return true;
    });

    if(!matches.length){ list.innerHTML = '<div class="sc-none">No shortcuts match.</div>'; return; }
    const order = (SC.categories || []).length ? SC.categories : [...new Set(items.map(i=>i.category))];

        const right = div('sc-right'); const cap = capOf(it);
        const badge = span('sc-cap ' + cap, capLabel[cap]);
        badge.title = (it.app_midi && it.app_midi.how) ? it.app_midi.how : (cap === 'hw' ? 'Not reachable over MIDI — front-panel only.' : '');
        right.appendChild(badge);

/* ---------- jump menu ----------
   Highlighting is computed from scroll position, not an IntersectionObserver
   band. The old version used rootMargin -45%/-50%, a sliver across the middle
   of the viewport: a short card like MIDI never occupies it, so clicking MIDI
   scrolled correctly but lit Transport. This instead takes the LAST section
   whose top has passed just under the sticky bar, which is unambiguous and
   always marks exactly one.

   The hash follows the same value via replaceState (no history entries) and is
   restored on load, so a refresh keeps you put.                              */
const navBtns = [...document.querySelectorAll('#nav button[data-t]')];
const SECTION_IDS = navBtns.map(b=>b.dataset.t).filter(id=>$(id));
let navLock = 0;                    // set while a click-scroll is in flight

function markSection(id){
  if(!id) return;
  try{ history.replaceState(null, '', '#' + id); }catch(e){}
}
function currentSection(){
  const probe = 150;                // just below the sticky bar
  let cur = SECTION_IDS[0];
  for(const id of SECTION_IDS){
    const el = $(id); if(!el) continue;
    if(el.getBoundingClientRect().top - probe <= 0) cur = id; else break;
  }
  /* the last card is usually too short to reach the probe line, so it would
     never light up without this */
  if(window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4){
    cur = SECTION_IDS[SECTION_IDS.length - 1];
  }
  return cur;
}
function paintNav(id){
  navBtns.forEach(x=> x.classList.toggle('active', x.dataset.t === id));
}
let queued = false;
function syncNav(){
  if(queued) return;
  queued = true;
  requestAnimationFrame(()=>{
    queued = false;
    if(Date.now() < navLock) return;   // don't fight a smooth scroll in progress
    const id = currentSection();
    paintNav(id); markSection(id);
  });
}
navBtns.forEach(b=> b.addEventListener('click', ()=>{
  const t = $(b.dataset.t); if(!t) return;
  /* paint immediately and hold it until the smooth scroll settles, so the
     intermediate sections it flies past never steal the highlight */
  paintNav(b.dataset.t); markSection(b.dataset.t);
  navLock = Date.now() + 700;
  t.scrollIntoView({behavior:'smooth', block:'start'});
}));
window.addEventListener('scroll', syncNav, {passive:true});
window.addEventListener('resize', syncNav);
{
  const want = decodeURIComponent(location.hash.replace('#',''));
  if(want && $(want)){
    paintNav(want);
    navLock = Date.now() + 700;
    requestAnimationFrame(()=> $(want).scrollIntoView({block:'start'}));
  } else {
    syncNav();
  }
}

/* ---------- SNAPSHOTS, EXPORT, SHARE ----------
   Three ways out of the same state object (see the STATE section below).

   Who sends and who doesn't is deliberate:
   * Load  — sends. Recalling a preset you saved is exactly a request to put
             the unit back the way it was.
   * Import / share link — silent. That state arrived from somewhere else, and
             firing MIDI at someone's rig the moment a link opens is rude. It
             lands in the UI and "Send panel to SP" is right there.

   Pad names ride in the exported FILE but not in the share LINK: 160 slots of
   free text would bloat a URL past what is comfortable to paste, while the
   file has no such limit.                                                    */
const SNAP_KEY = 'sp404_snaps';
const SNAP_MAX = 24;
const SHARE_PARAM = 's';

function b64urlEncode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b=> bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(str){
  const t = str.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(t + '==='.slice((t.length + 3) % 4));
  return new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0)));
}

let snaps = [];
try{ const raw = JSON.parse(lsGet(SNAP_KEY)); if(Array.isArray(raw)) snaps = raw; }catch(e){}

let snapMsgT = null;

}

}

/* ---------- STATE ----------
   One object describes the whole panel, and it does three jobs: it survives a
   refresh, it fills a snapshot slot, and it rides in a share link.

   The send/silent split is the important part.

   * Restoring on BOOT is silent. The SP still holds whatever we last sent it —
     a latched EXT note is still latched, BUS 1 is still on Vinyl Sim — so
     re-sending on every page load would be noise at best, and at worst would
     stamp a stale panel over knobs you have since moved on the unit. Silent
     restore is the accurate reading of the situation, not a shortcut.
   * Loading a SNAPSHOT sends. That is the entire point of pressing Load: you
     want the unit reconfigured to match.

   Saving polls rather than hooking every control. There are ~40 places state
   can change and a missed hook is a silent data-loss bug; a 1.5s diff of a
   small object costs nothing and cannot miss one.                            */
const STATE_KEY = 'sp404_state';
const STATE_V = 1;

function collectState(){
  return {
    v: STATE_V,
    fx: BUSES.map(b=>({ ch:b.ch, code:b.fx.get(), efx:b.efxOn(), k:b.knobs.map(k=>k.get()) })),
    pads: { bank:padBank, vel:padVelKnob.get(), ext:extApi ? extApi.get() : null },
    chroma: { vel:chromaVel.get() },
    voc: { vel:vocVel.get() },
    pat: { bank:patBank },
    dj: { a:djVol[1].get(), b:djVol[2].get(), c:djVol[3].get(), x:djXfade.get() },
    loop: loopTempoKnob ? { tempo:loopTempoKnob.get() } : null,
    routing: routeApi ? routeApi.get() : null,
    /* motion definitions, not the instant they were caught: the centre lives in
       the knob value above, so a snapshot restores the sweep, not a frozen
       point on it */
    mod: Object.keys(modLanes).map(k=>{ const L = modLanes[k];
      return { ch:L.ch, i:L.i, shape:L.shape, mode:L.mode || 'hz', rate:L.rate, div:L.div,
               depth:L.depth, phase:L.phase || 0, bipolar:!!L.bipolar, running:!!L.running }; }),
    ui: { monitor:monOn, follow:followOn, padNames:padNamesOn },
  };
}

function applyState(st, send){
  if(!st || typeof st !== 'object') return false;

  if(Array.isArray(st.fx)) st.fx.forEach(f=>{
    const bus = busByCh[f.ch]; if(!bus) return;
    const code = String(f.code);
    if(f.code != null && TABLES[bus.table] && TABLES[bus.table][code] != null){
      bus.fx.set(code);
      if(send) sendCC(bus.ch, CC_SEL, +code, null);
    }
    /* relabels and re-enables the knobs for the new effect — must run before
       the values go in, or an OFF effect would zero what we just restored */
    bus.applyParams();
    /* Set silently ALWAYS, then send explicitly. Leaning on the knob's own
       change detection would silently skip any value that already matches —
       which is exactly the case for "Send panel to SP", where nothing has
       moved and yet everything needs to go out. */
    if(Array.isArray(f.k)) f.k.forEach((v,i)=>{
      const k = bus.knobs[i]; if(!k || v == null) return;
      k.set(v, true);
      if(send) sendCC(bus.ch, k.cc, v, null);
    });
    bus.setEfx(!!f.efx);
    if(send) sendCC(bus.ch, CC_SW, f.efx ? 127 : 0, null);
  });

  if(st.pads){
    if(st.pads.bank) setPadBank(st.pads.bank);
    if(st.pads.vel != null) padVelKnob.set(st.pads.vel, true);
    if(extApi) extApi.set(st.pads.ext, send);
  }
  if(st.chroma && st.chroma.vel != null) chromaVel.set(st.chroma.vel, true);
  if(st.voc && st.voc.vel != null) vocVel.set(st.voc.vel, true);
  if(st.pat && st.pat.bank) setPatBank(st.pat.bank);
  if(st.dj){
    [[1,'a'],[2,'b'],[3,'c']].forEach(([ch,key])=>{
      const v = st.dj[key]; if(v == null) return;
      djVol[ch].set(v, true);
      if(send) sendCC(ch, 7, v, null);
    });
    if(st.dj.x != null){ djXfade.set(st.dj.x, true); if(send) sendCC(1, 8, st.dj.x, null); }
  }
  if(st.loop && loopTempoKnob && st.loop.tempo != null){
    loopTempoKnob.set(st.loop.tempo, true);
    if(send && loopTempoKnob.cc != null) sendCC(LOOP.channel, loopTempoKnob.cc, st.loop.tempo, null);
  }
  if(st.routing && routeApi) routeApi.set(st.routing);   // hardware-only; never sent
  /* after the effects, because changing an effect deliberately clears motion on
     that bus — restoring first would have it wiped a line later */
  clearAllMotion(true);
  if(Array.isArray(st.mod)) st.mod.forEach(L=>{
    if(!busByCh[L.ch] || CTRL_CCS[L.i] == null) return;
    setLane(L.ch, L.i, { shape:L.shape, mode:L.mode || 'hz', rate:L.rate, div:L.div || '1bar',
      depth:L.depth, phase:L.phase || 0, bipolar:L.bipolar !== false, running:L.running !== false });
  });
  if(st.ui){
    if(st.ui.monitor != null) setMonitor(!!st.ui.monitor);
    if(st.ui.follow  != null){ followOn = !!st.ui.follow; paintFollow(); }
    if(st.ui.padNames != null) setPadNaming(!!st.ui.padNames);
  }
  return true;
}

let lastSaved = null;
function persistState(){
  try{
    const json = JSON.stringify(collectState());
    if(json === lastSaved) return;
    lastSaved = json;
    lsSet(STATE_KEY, json);
  }catch(e){}
}
{
  const shared = readShareParam();
  let saved = null;
  try{ saved = JSON.parse(lsGet(STATE_KEY)); }catch(e){}
  if(shared){
    applyState(shared, false);
    snapMsg('Opened a shared setup. Nothing has been sent — press “Send panel to SP” to put it on your unit.', true);
  }else if(saved && saved.v === STATE_V){
    applyState(saved, false);
  }
  lastSaved = JSON.stringify(collectState());
}
setInterval(persistState, 1500);
window.addEventListener('pagehide', persistState);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') persistState(); });

/* ---------- go ---------- */
initMIDI();

})();

<script>
/* ---------- PWA ----------
   Registered outside the app IIFE so a failure here can never take the app
   down with it. There is deliberately NO auto-reload when an update lands:
   sw.js is network-first, so the document you are looking at already came off
   the network — a reload would gain nothing and could interrupt a take. The
   new worker still replaces the old one immediately via skip-waiting, so the
   offline copy is never more than one load behind main. */
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        var incoming = reg.installing;
        if(!incoming) return;
        incoming.addEventListener('statechange', function(){
          if(incoming.state === 'installed' && navigator.serviceWorker.controller){
            incoming.postMessage('skip-waiting');
          }
        });
      });
      reg.update();
    }).catch(function(){});
  });
}
</script>
